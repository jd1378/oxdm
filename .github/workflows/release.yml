name: GitHub release

#
# What a release publishes, per target:
#   - oxdm-<tag>-<target>.tar.gz — both binaries, the icon, README,
#     LICENSE. One archive per target, on every platform: it is what a
#     person downloads *and* what the in-app updater fetches, which
#     takes the two programs out of it by name and ignores the rest.
#   - oxdm-<tag>-<arch>.AppImage on desktop Linux, for people who
#     prefer a bundle; the installer script does not use it
#   - <asset>.sha256 beside every one of them
#   - update-<target>.json and, where there is a bundle,
#     update-<target>-appimage.json — the feeds the in-app updater
#     reads. Each names one artifact and carries its digest, which the
#     updater verifies before replacing anything. The app picks the
#     flavour at run time by whether it was launched from a bundle.
#
# The feeds are fetched from the `latest` release, so their URLs are
# stable across releases:
#   https://github.com/<repo>/releases/latest/download/update-<target>.json

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to upload artifacts to (leave empty for latest)'
        required: false
        default: ''

env:
  # Incremental artifacts are per-machine state a runner never keeps,
  # so they cost disk and cache size for nothing.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  all-jobs:
    if: always() # Otherwise this job is skipped if the matrix job fails
    name: all-jobs
    runs-on: ubuntu-latest
    needs:
      - crate_metadata
      - lint
      - tests
      - cargo-audit
      - build
    steps:
      - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'

  crate_metadata:
    name: Extract crate metadata
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Extract crate information
      id: crate_metadata
      run: |
        set -euo pipefail
        TAG="${{ github.event.inputs.tag }}"
        if [ -z "$TAG" ]; then
          git fetch --tags
          TAG=$(git tag --sort=-creatordate | head -n 1)
        fi
        git fetch --tags --prune
        git checkout "tags/$TAG" -b "release-$TAG"
        echo "tag=$TAG" >> $GITHUB_OUTPUT

        # By name, not by position: this is a workspace, and
        # `.packages[0]` is whichever member cargo lists first — the
        # test server, whose version has nothing to do with a release.
        META=$(cargo metadata --no-deps --format-version 1 \
          | jq --exit-status '.packages[] | select(.name == "oxdm")')
        jq -r '"name=" + .name' <<< "$META" | tee -a $GITHUB_OUTPUT
        jq -r '"version=" + .version' <<< "$META" | tee -a $GITHUB_OUTPUT
        jq -r '"maintainer=" + .authors[0]' <<< "$META" | tee -a $GITHUB_OUTPUT
        jq -r '"homepage=" + .homepage' <<< "$META" | tee -a $GITHUB_OUTPUT

        VERSION=$(jq -r '.version' <<< "$META")
        # The built binary reports CARGO_PKG_VERSION, and the in-app
        # updater compares the feed against it. A tag that disagrees
        # with the manifest ships an app that thinks it is a different
        # version than the release it came from — and, once the feed
        # says otherwise, offers itself an update forever.
        if [ "v$VERSION" != "$TAG" ]; then
          echo "::error::tag $TAG does not match Cargo.toml version $VERSION (expected tag v$VERSION)"
          exit 1
        fi

        # A tag like v1.2.3-rc1 is a pre-release; v1.2.3 is not. This
        # decides how the release is marked, which decides whether
        # `releases/latest` — what the installers and the update feed
        # resolve — will point at it.
        case "$TAG" in
          *-*) echo "prerelease=true" >> $GITHUB_OUTPUT ;;
          *)   echo "prerelease=false" >> $GITHUB_OUTPUT ;;
        esac
    outputs:
      name: ${{ steps.crate_metadata.outputs.name }}
      version: ${{ steps.crate_metadata.outputs.version }}
      maintainer: ${{ steps.crate_metadata.outputs.maintainer }}
      homepage: ${{ steps.crate_metadata.outputs.homepage }}
      tag: ${{ steps.crate_metadata.outputs.tag }}
      prerelease: ${{ steps.crate_metadata.outputs.prerelease }}

  lint:
    name: Ensure code quality
    runs-on: ubuntu-latest
    needs: crate_metadata
    steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt,clippy
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ needs.crate_metadata.outputs.tag }}
    - name: Cache the dependency build
      uses: Swatinem/rust-cache@v2
    - run: cargo fmt -- --check
    - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: crate_metadata
    steps:
    - name: Git checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ needs.crate_metadata.outputs.tag }}
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache the dependency build
      uses: Swatinem/rust-cache@v2
    - name: Run tests
      run: cargo test --locked

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    needs: crate_metadata
    steps:
      # A prebuilt binary. Building cargo-audit from source spent
      # minutes on a tool that never changes between releases.
      - uses: taiki-e/install-action@cargo-audit
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.crate_metadata.outputs.tag }}
      - run: cargo audit

  build:
    permissions:
      contents: write
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    needs: crate_metadata
    strategy:
      fail-fast: false
      matrix:
        job:
          # Every target builds natively: this is a desktop app, and
          # each host here is the platform it is building for.
          #
          # No musl, and not for the reason it used to be. The C
          # libdbus that once ruled it out is gone (keyring 4 speaks
          # Secret Service over zbus), so a Linux build links libc and
          # nothing else — but a *static* build still cannot run this
          # app. winit reaches X11 through x11-dl and Wayland through
          # wayland-backend's dlopen feature, and musl's static libc
          # has no dynamic loader: the binary would build, ship, and
          # then fail to open a window on either display server.
          #
          # A dynamically linked musl target would work on Alpine, at
          # which point it is no longer the portable static binary
          # people ask musl for. Old-glibc systems are what the
          # AppImage is for.
          #
          # `appimage: true` marks the Linux targets that also get a
          # single-file bundle.
          - { target: x86_64-unknown-linux-gnu    , os: ubuntu-latest,    appimage: true }
          - { target: aarch64-unknown-linux-gnu   , os: ubuntu-24.04-arm, appimage: true }
          - { target: x86_64-apple-darwin         , os: macos-15-intel }
          - { target: aarch64-apple-darwin        , os: macos-14 }
          - { target: x86_64-pc-windows-msvc      , os: windows-2025 }
          - { target: aarch64-pc-windows-msvc     , os: windows-11-arm }
    steps:
    - name: Checkout source code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ needs.crate_metadata.outputs.tag }}

    # No system libraries to install: a Linux build links libc, libm
    # and libgcc and nothing else — every desktop service it uses
    # (tray, notifications, keyring, network and power state) is
    # spoken over D-Bus in pure Rust. Nothing needs protoc either: odl
    # compiles its metadata schema with protox, in-process.
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.job.target }}

    - name: Show version information (Rust, cargo, GCC)
      shell: bash
      run: |
        gcc --version || true
        rustup -V
        rustup toolchain list
        rustup default
        cargo -V
        rustc -V

    - name: Cache the dependency build
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.job.target }}

    - name: Build
      shell: bash
      run: cargo build --locked --release --target=${{ matrix.job.target }} --bins

    - name: Run tests
      shell: bash
      # Library tests only: the binaries are GUI/daemon entry points
      # with nothing to assert without a session bus and a display.
      #
      # In the release profile, so this reuses what Build just
      # compiled. A dev-profile test run shares nothing with it and
      # built the whole dependency graph a second time — on six
      # targets, that was most of the wall clock.
      run: cargo test --locked --release --lib --target=${{ matrix.job.target }}

    - name: Stage binaries
      id: bin
      shell: bash
      run: |
        set -euo pipefail
        EXE_suffix=""
        case ${{ matrix.job.target }} in *-pc-windows-*) EXE_suffix=".exe" ;; esac

        OUT="target/${{ matrix.job.target }}/release"
        # All three ship together: without the native host there is no
        # browser integration, and without the updater oxdm cannot
        # install its own updates. Both used to be left out.
        for bin in oxdm oxdm-native-host; do
          test -f "${OUT}/${bin}${EXE_suffix}" || { echo "::error::missing ${bin}${EXE_suffix}"; exit 1; }
        done

        echo "EXE_SUFFIX=${EXE_suffix}" >> $GITHUB_OUTPUT
        echo "OUT_DIR=${OUT}" >> $GITHUB_OUTPUT

    - name: Create archive
      id: package
      shell: bash
      run: |
        set -euo pipefail
        # A .tar.gz on every platform, Windows included. The updater
        # takes the same archive a person downloads — one artifact per
        # target instead of a near-duplicate for each — so its format
        # has to be one the daemon can unpack itself. Windows ships
        # bsdtar as `tar.exe`, which is what install.ps1 uses.
        PKG_suffix=".tar.gz"
        # Named from the tag, not from Cargo.toml: the installers build
        # this exact filename from the tag they resolved, and a release
        # tagged differently from the manifest used to publish assets
        # nothing could find.
        PKG_BASENAME=${{ needs.crate_metadata.outputs.name }}-${{ needs.crate_metadata.outputs.tag }}-${{ matrix.job.target }}
        PKG_NAME=${PKG_BASENAME}${PKG_suffix}

        PKG_STAGING="_cicd-intermediates/package"
        ARCHIVE_DIR="${PKG_STAGING}/${PKG_BASENAME}/"
        mkdir -p "${ARCHIVE_DIR}"

        EXE="${{ steps.bin.outputs.EXE_SUFFIX }}"
        for bin in oxdm oxdm-native-host; do
          cp "${{ steps.bin.outputs.OUT_DIR }}/${bin}${EXE}" "$ARCHIVE_DIR"
        done
        cp README.md LICENSE "$ARCHIVE_DIR"
        cp tools/install-native-host.sh "$ARCHIVE_DIR" 2>/dev/null || true
        # The launcher entry the installer writes points at this, so a
        # tarball install looks like an application rather than a
        # generic download arrow.
        # The opaque variant on purpose. A launcher icon cannot vary
        # with the desktop's theme — a .desktop entry names one icon
        # and the icon theme resolves one file — so it has to be the
        # one that reads on a light *and* a dark panel. The `_dark`
        # asset is a dark glyph *for* light backgrounds and vanishes
        # into a dark dock.
        cp assets/oxdm_idle_light.png "$ARCHIVE_DIR/oxdm.png"

        pushd "${PKG_STAGING}/" >/dev/null
        tar czf "${PKG_NAME}" "${PKG_BASENAME}"/*
        popd >/dev/null

        echo "PKG_NAME=${PKG_NAME}" >> $GITHUB_OUTPUT
        echo "PKG_PATH=${PKG_STAGING}/${PKG_NAME}" >> $GITHUB_OUTPUT

    - name: Build AppImage
      id: appimage
      if: matrix.job.appimage
      shell: bash
      run: |
        set -euo pipefail
        TAG="${{ needs.crate_metadata.outputs.tag }}"
        TARGET="${{ matrix.job.target }}"
        case "$TARGET" in
          x86_64-*)  ARCH=x86_64 ;;
          aarch64-*) ARCH=aarch64 ;;
          *) echo "::error::no AppImage runtime for $TARGET"; exit 1 ;;
        esac

        APPDIR="_cicd-intermediates/AppDir"
        mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                 "$APPDIR/usr/share/icons/hicolor/512x512/apps"

        for bin in oxdm oxdm-native-host; do
          install -Dm755 "${{ steps.bin.outputs.OUT_DIR }}/${bin}" "$APPDIR/usr/bin/${bin}"
        done
        install -Dm644 assets/oxdm_idle_light.png \
          "$APPDIR/usr/share/icons/hicolor/512x512/apps/oxdm.png"
        cp "$APPDIR/usr/share/icons/hicolor/512x512/apps/oxdm.png" "$APPDIR/oxdm.png"

        cat > "$APPDIR/oxdm.desktop" <<'EOF'
        [Desktop Entry]
        Type=Application
        Name=oxdm
        Comment=Cross-platform download manager
        Exec=oxdm %U
        Icon=oxdm
        Terminal=false
        Categories=Network;FileTransfer;
        StartupNotify=true
        StartupWMClass=oxdm
        EOF
        cp "$APPDIR/oxdm.desktop" "$APPDIR/usr/share/applications/oxdm.desktop"

        # The AppImage is one file that is also the executable, which
        # is exactly what the in-app updater swaps itself with. AppRun
        # keeps the bundled siblings reachable: oxdm spawns its own
        # windows and the updater by path next to itself.
        cat > "$APPDIR/AppRun" <<'EOF'
        #!/bin/sh
        HERE="$(dirname "$(readlink -f "$0")")"
        export PATH="$HERE/usr/bin:$PATH"
        exec "$HERE/usr/bin/oxdm" "$@"
        EOF
        chmod +x "$APPDIR/AppRun"

        # Built by hand rather than with appimagetool, because what
        # appimagetool produces today does not run on a large share of
        # desktops.
        #
        # Its `continuous` build bundles a zstd-only mksquashfs and
        # stamps the new static-pie runtime. AppImageLauncher — which
        # several distros install by default and which takes over every
        # AppImage through binfmt_misc — carries an older libappimage
        # that reads neither: zstd it rejects outright ("uses (null)
        # compression"), and the static-pie runtime confuses its offset
        # calculation ("this doesn't look like a squashfs image").
        # Upstream's own appimagetool AppImage fails the same way on
        # such a machine.
        #
        # So: the classic AppImageKit runtime, which every AppImage
        # that does work there uses, and an xz payload, which its
        # squashfuse can read. mksquashfs is the distro's own, so
        # nothing needs an AppImage to build one.
        #
        # The cost of the classic runtime is that it wants libfuse2 at
        # run time; where that is missing, `--appimage-extract-and-run`
        # still works, and the tarball is the better answer anyway.
        fetch() {
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 -o "$1" "$2"
        }
        fetch "runtime-${ARCH}" \
          "https://github.com/AppImage/AppImageKit/releases/download/continuous/runtime-${ARCH}"

        APPIMAGE_NAME="${{ needs.crate_metadata.outputs.name }}-${TAG}-${ARCH}.AppImage"
        sudo apt-get install -y --no-install-recommends squashfs-tools >/dev/null
        mksquashfs "$APPDIR" payload.squashfs \
          -root-owned -noappend -no-progress \
          -comp xz -b 128K -Xdict-size 100%
        cat "runtime-${ARCH}" payload.squashfs \
          > "_cicd-intermediates/${APPIMAGE_NAME}"
        chmod +x "_cicd-intermediates/${APPIMAGE_NAME}"

        # A structural check, so a broken layout fails here rather than
        # on somebody's desktop: the payload has to start exactly where
        # the runtime says it does.
        OFFSET=$(stat -c %s "runtime-${ARCH}")
        MAGIC=$(dd if="_cicd-intermediates/${APPIMAGE_NAME}" bs=1 \
          skip="$OFFSET" count=4 2>/dev/null)
        if [ "$MAGIC" != "hsqs" ]; then
          echo "::error::no squashfs at offset $OFFSET (found '${MAGIC}')"
          exit 1
        fi
        unsquashfs -l -o "$OFFSET" "_cicd-intermediates/${APPIMAGE_NAME}" \
          | grep -q 'squashfs-root/usr/bin/oxdm$' \
          || { echo "::error::AppImage payload has no oxdm in it"; exit 1; }

        echo "APPIMAGE_NAME=${APPIMAGE_NAME}" >> $GITHUB_OUTPUT
        echo "APPIMAGE_PATH=_cicd-intermediates/${APPIMAGE_NAME}" >> $GITHUB_OUTPUT

    - name: Stage the updatable artifact, checksums and update feed
      id: publish
      shell: bash
      run: |
        set -euo pipefail
        TAG="${{ needs.crate_metadata.outputs.tag }}"
        TARGET="${{ matrix.job.target }}"
        NAME="${{ needs.crate_metadata.outputs.name }}"
        VERSION="${{ needs.crate_metadata.outputs.version }}"
        STAGING="_cicd-intermediates/publish"
        mkdir -p "$STAGING"

        # The updater downloads the same archive a person does. It
        # holds the app, the browser's native host and some
        # documentation; the daemon takes the two programs out by name
        # and ignores the rest, so a second near-identical artifact
        # bought nothing but bandwidth and one more thing to keep in
        # step. An installed build replaces both programs — leaving the
        # host behind would pair a new app with an older program
        # speaking to it.
        #
        # An AppImage needs none of this. One file holds all three, so
        # the bundle is its own artifact.
        SINGLE_NAME="${{ steps.package.outputs.PKG_NAME }}"
        APPIMAGE_NAME="${{ steps.appimage.outputs.APPIMAGE_NAME }}"
        if [ -n "$APPIMAGE_NAME" ]; then
          cp "${{ steps.appimage.outputs.APPIMAGE_PATH }}" "$STAGING/$APPIMAGE_NAME"
        fi
        cp "${{ steps.package.outputs.PKG_PATH }}" "$STAGING/"

        # A digest beside every asset, and the same digest inside the
        # feed: the updater refuses an artifact it cannot verify.
        pushd "$STAGING" >/dev/null
        for f in *; do
          case "$f" in *.sha256) continue ;; esac
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$f" > "${f}.sha256"
          else
            shasum -a 256 "$f" > "${f}.sha256"
          fi
        done
        SINGLE_SHA=$(cut -d' ' -f1 < "${SINGLE_NAME}.sha256")
        if [ -n "$APPIMAGE_NAME" ]; then
          APPIMAGE_SHA=$(cut -d' ' -f1 < "${APPIMAGE_NAME}.sha256")
        fi
        popd >/dev/null

        # One feed per flavour. `update-<target>.json` is what an
        # installed build reads; `update-<target>-appimage.json` is
        # what the same build reads when it was launched from a bundle.
        write_feed() {
          cat > "$STAGING/$1" <<EOF
        {
          "version": "${VERSION}",
          "url": "${{ needs.crate_metadata.outputs.homepage }}/releases/download/${TAG}/$2",
          "notes": "${{ needs.crate_metadata.outputs.homepage }}/releases/tag/${TAG}",
          "sha256": "$3"
        }
        EOF
        }
        write_feed "update-${TARGET}.json" "$SINGLE_NAME" "$SINGLE_SHA"
        if [ -n "$APPIMAGE_NAME" ]; then
          write_feed "update-${TARGET}-appimage.json" "$APPIMAGE_NAME" "$APPIMAGE_SHA"
        fi

        echo "ARTIFACTS=${STAGING}/*" >> $GITHUB_OUTPUT
        echo "STAGING=${STAGING}" >> $GITHUB_OUTPUT

    # v7 rather than v5: v5 still declares `runs.using: node20`, so it
    # would keep the deprecation warning. v6 is the runtime bump to
    # node24 and v7 only adds inputs (`archive`, defaulting to the old
    # behaviour), so `name` + `path` mean what they always did.
    - name: "Artifact upload"
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.job.target }}
        path: ${{ steps.publish.outputs.STAGING }}/*

    - name: Publish archives and packages
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ needs.crate_metadata.outputs.tag }}
        omitBody: true
        omitBodyDuringUpdate: true
        omitName: true
        allowUpdates: true
        # Only a tag that says so is a pre-release. Marking every
        # release one kept them out of `releases/latest`, which is
        # where both installers and the update feed look.
        prerelease: ${{ needs.crate_metadata.outputs.prerelease }}
        omitPrereleaseDuringUpdate: true
        replacesArtifacts: true
        updateOnlyUnreleased: false
        artifacts: ${{ steps.publish.outputs.ARTIFACTS }}
