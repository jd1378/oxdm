[workspace]
members = ["testserver"]

[package]
name = "oxdm"
description = "a download manager using odl"
version = "0.12.1"
edition = "2024"
repository = "https://github.com/jd1378/oxdm"
homepage = "https://github.com/jd1378/oxdm"
license = "AGPL-3.0"
authors = ["jd1378 <javad.mnjd@hotmail.com>"]

[dependencies]
odl = { version = "3", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "net", "time", "fs", "process", "io-std", "signal"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
percent-encoding = "2"
indexmap = { version = "2", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
humantime = "2"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
tokio-tungstenite = "0.30"
dark-light = "2"
notify-rust = "4"
rand = "0.10"
base64 = "0.23"
aes-gcm = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["http2", "gzip", "brotli", "rustls", "stream", "json"] }
semver = "1"
keyring = "4"
trash = "5"
libc = "0.2"
fs4 = "1.1"
interprocess = { version = "2", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# `crisp` (an iced default we lost by opting out of default-features)
# makes every quad snap to the pixel grid, so 1px borders and hairlines
# stay 1px instead of being anti-aliased into a soft 2px band. Honoured
# by the vendored tiny-skia backend — see `engine.rs::snap_quad`.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "wayland", "x11", "tokio", "canvas", "svg", "image", "advanced", "crisp"] }
# Pinned exactly: 0.3.1 is the audited revision (source reviewed — no
# `unsafe`, no I/O, no build script; only deps are `iced_core` /
# `iced_widget`, which are already in-tree via `iced`). Re-audit before
# bumping. Transitive versions are pinned by Cargo.lock.
iced_anim = { version = "=0.3.1", default-features = false, features = ["widgets"] }
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
tar = "0.4"
flate2 = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.4"
# Already in-tree via notify-rust; direct use: NetworkManager Metered probe.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.24"
muda = "0.19"
# Single-instance lock everywhere but Linux, which binds its own
# abstract socket (the crate's has no `SOCK_CLOEXEC`, so children
# inherit it and keep the name taken after the daemon is gone — see
# `single_instance::Lock`). Gated on exactly the cfg the `use` in that
# module carries, so the two cannot drift.
single-instance = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    # Queue conditions: idle time (GetTickCount64) and mains/battery
    # state (GetSystemPowerStatus).
    "Win32_System_SystemInformation",
    "Win32_System_Power",
] }
raw-window-handle = "0.6"
# WinRT, for the one probe Win32 cannot answer: whether the active
# connection is metered (`NetworkInformation.GetConnectionCost`). The
# lighter `windows-sys` above exposes no WinRT surface.
windows = { version = "0.62", features = [
    "Networking_Connectivity",
    "Win32_System_Com",
    # `SHOpenFolderAndSelectItems`: reveal a file without spawning a
    # second Explorer window for a folder that is already open.
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
# Only for `examples/clipset.rs`, which holds text on the X11 clipboard
# for the visual-test harness. The app itself reads and writes through
# `iced::clipboard` (the window's own connection to the display
# server), so nothing that ships links this.
arboard = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

# What ships. `lto`/`codegen-units` are worth the longer link on a
# binary this size, and `strip` takes ~25% off what the user
# downloads — a self-update fetches the whole executable every time,
# so the size is not only an install-time cost. `panic` stays at
# unwind: the daemon catches panics in download tasks so one bad run
# cannot take the process (and every other download) with it.
# Build-time only: there is no way to put an icon in a .exe from Rust
# source — it has to be a linked resource, and this generates and links
# one. Not gated on `cfg(windows)`, which would describe the machine
# doing the building rather than the machine the binary is for; the
# build script decides by target and does nothing for the others.
[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Keep our crate unoptimised (fast incremental + debugger), but build
# dependencies at -O3 so iced/tiny-skia rasterisation isn't the
# dev-build bottleneck on subprocess spawn.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[[bin]]
name = "oxdm"
path = "src/main.rs"

[[bin]]
name = "oxdm-native-host"
path = "src/bin/oxdm-native-host.rs"

# iced 0.14.0's tiny-skia backend double-transforms canvas clip bounds
# (draw_primitive_group pre-multiplies, the renderer multiplies again),
# shifting/clipping all nested canvas geometry. Vendored with a 2-line fix.
#
# iced 0.14.0's winit runtime discards `request_inner_size`'s return
# value. Wayland resizes synchronously and returns the applied size
# instead of emitting `Resized`, so a programmatic `window::resize`
# never reached the viewport. Vendored with the feedback path added.
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
iced_winit = { path = "vendor/iced_winit" }
